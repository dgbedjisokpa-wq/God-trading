<!DOCTYPE html> <!-- Indique au navigateur qu'il s'agit d'une page HTML moderne -->
<html lang="fr"> <!-- Début de la page ; lang="fr" : la page est en français -->
<head> <!-- En-tête invisible : réglages, titre, styles et scripts -->
  <meta charset="utf-8"> <!-- Encodage des caractères : autorise les accents -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Adapte l'affichage aux téléphones -->
  <title>Odyssée — Afrique Authentique</title> <!-- Titre de l'onglet et des résultats Google -->
  <meta name="description" content="Fiche destination : l’esprit du lieu, un itinéraire indicatif et nos conseils pour voyager autrement."> <!-- Résumé affiché dans Google -->
  <meta property="og:title" content="Odyssée — Afrique Authentique"> <!-- Titre quand la page est partagée -->
  <meta property="og:description" content="Fiche destination : l’esprit du lieu, un itinéraire indicatif et nos conseils pour voyager autrement."> <!-- Description du partage -->
  <meta property="og:type" content="article"> <!-- Type de contenu partagé -->
  <meta name="theme-color" content="#1C1511"> <!-- Couleur de la barre du navigateur sur mobile -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"> <!-- Icône de l'onglet -->
  <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- Prépare la connexion au service de polices -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- Idem pour les fichiers de police -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&amp;family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&amp;display=swap"> <!-- Les 3 polices du site -->
  <link rel="stylesheet" href="css/1-fondations.css"> <!-- Styles : couleurs, polices, boutons -->
  <link rel="stylesheet" href="css/2-motifs.css"> <!-- Styles : motifs textiles et visuels -->
  <link rel="stylesheet" href="css/3-structure.css"> <!-- Styles : en-tête, menu, pied de page, calebasse -->
  <link rel="stylesheet" href="css/4-sections.css"> <!-- Styles : sections et cartes -->
  <link rel="stylesheet" href="css/5-pages.css"> <!-- Styles : pages particulières -->
  <script>document.documentElement.classList.add('js');</script> <!-- Signale que JavaScript fonctionne -->
  <script src="js/donnees/reglages.js" defer></script> <!-- Contenus : réglages, menu, proverbes -->
  <script src="js/donnees/recits.js" defer></script> <!-- Contenus : les récits -->
  <script src="js/donnees/odyssees.js" defer></script> <!-- Contenus : les destinations -->
  <script src="js/donnees/tresors.js" defer></script> <!-- Contenus : les produits -->
  <script src="js/donnees/agenda.js" defer></script> <!-- Contenus : les événements -->
  <script src="js/site.js" defer></script> <!-- Fonctionnement commun -->
  <script src="js/rendu.js" defer></script> <!-- Affichage des contenus -->
</head> <!-- Fin de l'en-tête invisible -->
<body data-page="destination"> <!-- Corps de la page ; data-page="destination" sert à surligner le bon lien du menu -->
  <div class="rideau" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div> <!-- Rideau coloré qui se lève à l'ouverture -->
  <a class="evitement" href="#contenu">Aller au contenu</a> <!-- Lien visible au clavier : saute le menu -->
  <div data-entete></div> <!-- Emplacement de l'en-tête (construit par js/site.js) -->

  <main id="contenu"> <!-- Contenu principal de la page -->
    <div data-destination></div> <!-- Fiche destination, remplie automatiquement d'après l'adresse (destination.html?id=…) -->

    <section class="section section--sombre" aria-labelledby="titre-autres"> <!-- Autres destinations -->
      <div class="conteneur"> <!-- Largeur limitée -->
        <header class="tete-section tete-section--fendue" data-revele> <!-- En-tête de section -->
          <p class="etiquette tete-section__surtitre"><span class="num">05</span> Continuer le voyage</p> <!-- Surtitre numéroté -->
          <h2 class="titre-section" id="titre-autres">Autres <em>odyssées</em></h2> <!-- Titre -->
          <div class="pile"> <!-- Lien + boutons de défilement -->
            <a class="lien-fleche" href="odyssees.html">Toutes les odyssées <span class="fleche" aria-hidden="true">→</span></a> <!-- Lien -->
            <div class="defile__controles"><button class="defile__bouton" type="button" data-defile-precedent="defile-autres" aria-label="Précédent">←</button><button class="defile__bouton" type="button" data-defile-suivant="defile-autres" aria-label="Suivant">→</button></div> <!-- Boutons ← → -->
          </div> <!-- Fin de la pile -->
        </header> <!-- Fin de l'en-tête -->
      </div> <!-- Fin du conteneur -->
      <div class="defile" id="defile-autres" data-defile data-autres-odyssees data-cascade></div> <!-- Rangée des autres destinations -->
    </section> <!-- Fin de la section -->
  </main> <!-- Fin du contenu principal -->

  <div data-pied></div> <!-- Emplacement du pied de page (construit par js/site.js) -->
</body> <!-- Fin du corps -->
</html> <!-- Fin de la page -->
