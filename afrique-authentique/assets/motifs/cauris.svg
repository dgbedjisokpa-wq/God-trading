<!-- MOTIF « CAURIS » (coquillages, ancienne monnaie et objet rituel) — carreau de 90 × 90. -->
<!-- Chaque cauri = une ellipse + la fente dentelée au centre.                              -->
<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90"> <!-- Zone de dessin de 90 × 90 -->
  <g fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"> <!-- Traits noirs arrondis -->
    <g transform="translate(22 26)"> <!-- Cauri n° 1, placé en haut à gauche -->
      <ellipse rx="10" ry="15"/> <!-- Contour du coquillage -->
      <path d="M0 -10 C3 -4 -3 4 0 10"/> <!-- Fente centrale légèrement ondulée -->
      <path d="M-4 -6 H-1 M1 -2 H4 M-4 2 H-1 M1 6 H4"/> <!-- Petites dents de part et d'autre de la fente -->
    </g> <!-- Fin du cauri n° 1 -->
    <g transform="translate(64 62) rotate(35)"> <!-- Cauri n° 2, en bas à droite, incliné -->
      <ellipse rx="10" ry="15"/> <!-- Contour -->
      <path d="M0 -10 C3 -4 -3 4 0 10"/> <!-- Fente -->
      <path d="M-4 -6 H-1 M1 -2 H4 M-4 2 H-1 M1 6 H4"/> <!-- Dents -->
    </g> <!-- Fin du cauri n° 2 -->
    <g transform="translate(70 18) rotate(-60) scale(.7)"> <!-- Cauri n° 3, plus petit, en haut à droite -->
      <ellipse rx="10" ry="15"/> <!-- Contour -->
      <path d="M0 -10 C3 -4 -3 4 0 10"/> <!-- Fente -->
    </g> <!-- Fin du cauri n° 3 -->
    <g transform="translate(20 70) rotate(80) scale(.7)"> <!-- Cauri n° 4, petit, en bas à gauche -->
      <ellipse rx="10" ry="15"/> <!-- Contour -->
      <path d="M0 -10 C3 -4 -3 4 0 10"/> <!-- Fente -->
    </g> <!-- Fin du cauri n° 4 -->
  </g> <!-- Fin des traits -->
</svg> <!-- Fin du dessin -->
